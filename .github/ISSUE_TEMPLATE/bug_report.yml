
name: Bug Report
description: Report a defect or unexpected behavior in BizDiag.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem with BizDiag.

        Please provide enough information to help reproduce and investigate the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the problem clearly.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide the steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Select the relevant BizDiag module.
      options:
        - Business-IT Alignment
        - Capability-Based Planning
        - Business Model Canvas
        - BizDiag Local AI
        - GraalJS Client/Server
        - Java DB Logger
        - Other / Not Sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Technical Environment
      description: Provide relevant versions (Archi, jArchi, JDK/GraalVM, GraalJS, Ollama, Ollama, and LLMs), and operating system information.
      placeholder: |
        Operating System:
        Archi Version:
        jArchi Version:
        Java / GraalVM Version:
        Ollama Version (if applicable):
        Installed LLMs (e.g., qwen3:4b, llama3.2:3b):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Messages and Logs
      description: Include relevant error messages or stack traces.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, model details, or other relevant information.
    validations:
      required: false
